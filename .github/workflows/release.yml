name: Package compatibility addon
on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and validate companion ZIP
        id: package
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: python3 scripts/package.py --version "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: addon-package
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
  attach-release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: addon-package
          path: dist
      - name: Attach companion ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
